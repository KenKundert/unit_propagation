[tox]
envlist = lint, pytest, mypy
isolated_build = True

[testenv:lint]
deps =
    setuptools
    ruff
skip_install = true
commands = ruff check

# Test environment
[testenv]
deps =
    pytest
    pytest-cov
    inform
    parametrize_from_file>=0.7
    voluptuous
commands =
    pytest --cov {posargs} --cov-branch --cov-report term-missing --doctest-glob="*.rst"

